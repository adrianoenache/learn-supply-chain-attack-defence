name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.engines.outputs.node }}
      npm-version: ${{ steps.engines.outputs.npm }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read engines from package.json
        id: engines
        run: |
          node_version=$(node -p "require('./package.json').engines.node.replace(/[^0-9.]/g, '')")
          npm_version=$(node -p "require('./package.json').engines.npm.replace(/[^0-9.]/g, '')")
          echo "node=${node_version}" >> "$GITHUB_OUTPUT"
          echo "npm=${npm_version}" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npx biome format tools/

  docs:
    name: Documentation Links
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Check markdown links
        run: npm run defence:check-md-links

  license:
    name: License Check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run license check
        run: npm run defence:license-check:fail

  lockfile-integrity:
    name: Lockfile Integrity
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Check lockfile integrity
        run: npm run defence:check-lockfile-integrity

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Scan tracked files for secrets
        run: git ls-files -z | xargs -0 -r npm run defence:check-secrets --

  defence-gates:
    name: Defence Gates
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Check engines
        run: npm run defence:check-engines

      - name: Sync check
        run: npm run defence:sync-check

      - name: Package age check
        run: npm run defence:pkg-age-check -- --transitive

      - name: Pre-commit gate
        run: |
          npm audit signatures
          npm audit --audit-level=high
          npm run defence:update-check
