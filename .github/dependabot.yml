version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # Gitflow: dependency PRs enter through dev, never directly into main
    # (main only receives release/* and hotfix/* PRs — see
    # docs/en/git-workflow.md).
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # No custom `labels:` — the repository has no `dependencies`/`github-actions`
    # labels; Dependabot creates the default `dependencies` label automatically.
    # No `reviewers:` — an empty list is invalid ("did not contain a minimum
    # number of items 1") and this is a solo-maintainer repo.
    open-pull-requests-limit: 10
